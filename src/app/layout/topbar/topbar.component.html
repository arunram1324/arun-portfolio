<header class="topbar">
  <div class="tb-left">
    <!-- Mobile Tablet Hamburger -->
    <button class="tb-ham" (click)="openDrawer()" aria-label="Open Navigation Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <h1 class="tb-title">{{ navService.currentTitle() }}</h1>
  </div>

  <div class="tb-right">
    <!-- Download CV Button in Topbar -->
    <button 
      type="button" 
      class="tb-btn-cv" 
      (click)="resumeService.openResumeModal()"
      title="View & Download Curriculum Vitae (CV)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span class="tb-cv-txt">CV / Resume</span>
    </button>

    <!-- Theme Toggle -->
    <button class="thm" (click)="toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'">

      @if (themeService.isDark()) {
      <span class="i-sun">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </span>
      } @else {
      <span class="i-moon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </span>
      }
    </button>
  </div>
</header>
