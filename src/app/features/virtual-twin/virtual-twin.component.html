<div class="vt-container">
  <!-- Mode Switcher Tabs (Voice / Chat) -->
  <div class="vt-tabs" role="tablist">
    <button 
      type="button"
      class="vt-tab" 
      [class.on]="activeMode() === 'voice'"
      (click)="switchMode('voice')"
      role="tab"
      [attr.aria-selected]="activeMode() === 'voice'">
      
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      Voice AI
    </button>

    <button 
      type="button"
      class="vt-tab" 
      [class.on]="activeMode() === 'chat'"
      (click)="switchMode('chat')"
      role="tab"
      [attr.aria-selected]="activeMode() === 'chat'">
      
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Chat AI
    </button>
  </div>

  <!-- Stage Views -->
  <div class="vt-stage-body">
    @if (activeMode() === 'voice') {
      <app-voice-stage (triggerQuestion)="handleHintFromVoice($event)"></app-voice-stage>
    } @else {
      <app-chat-stage></app-chat-stage>
    }
  </div>
</div>
