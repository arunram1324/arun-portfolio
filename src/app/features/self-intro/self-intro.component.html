<div class="ps-wrapper">
  <div class="intro-card">
    <!-- Top Left Title -->
    <h2 class="intro-ttl">Self Intro</h2>

    <!-- Center Top Arch & Photo Pillar -->
    <div class="intro-arch-container">
      <div class="intro-blue-pillar">
        <div class="intro-photo-arch">
          <img 
            [src]="portfolioData.profileInfo().photoUrl || 'arun-profile.jpg'" 
            [alt]="portfolioData.profileInfo().name" 
            class="intro-img"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
          
          <div class="intro-ph-fallback" style="display: none;">AK</div>
        </div>
      </div>
    </div>

    <!-- Center Body Content -->
    <div class="intro-body">
      <h3 class="intro-hl">{{ portfolioData.profileInfo().headline }}</h3>
      
      <p class="intro-desc">
        {{ portfolioData.profileInfo().bio }}
      </p>

      <!-- Industry Tags -->
      <div class="intro-tags">
        @for (tag of portfolioData.profileInfo().industries; track tag) {
          <span class="i-tag">{{ tag }}</span>
        }
      </div>

      <!-- Resume / CV Action Buttons -->
      <div class="intro-actions-bar">
        <button type="button" class="btn-intro-cv" (click)="resumeService.openResumeModal()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span>Curriculum Vitae (CV)</span>
        </button>

        <button type="button" class="btn-intro-dl" (click)="resumeService.downloadPdfResume()" title="Instant Download PDF Resume">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>PDF</span>
        </button>
      </div>
    </div>
  </div>
</div>
