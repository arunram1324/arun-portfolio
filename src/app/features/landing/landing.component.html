<div class="landing-page">
  <!-- Top Navigation Header -->
  <header class="landing-header">
    <div class="brand-logo">{{ portfolioData.profileInfo().name }}</div>

    <button 
      class="thm-btn" 
      (click)="toggleTheme()" 
      [attr.aria-label]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
      @if (themeService.isDark()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>
  </header>

  <!-- Hero Content Split -->
  <main class="landing-hero">
    <!-- Left Hero Column -->
    <div class="hero-left">
      <h1 class="hero-title">Portfolio with Virtual Twin</h1>
      
      <p class="hero-desc">
        {{ portfolioData.profileInfo().bio }}
      </p>

      <button class="btn-start" (click)="onStartNow()">
        <span>Explore Portfolio</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>

    <!-- Right Hero Column: Direct Image Asset Mockup -->
    <div class="hero-right">
      <div class="mockup-img-container">
        <img 
          src="landing-mockup.png" 
          alt="Arun KR Portfolio Mockup" 
          class="landing-mockup-img">
      </div>
    </div>
  </main>
</div>
