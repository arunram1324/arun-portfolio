<div class="pnl-card" [ngClass]="customClass">
  <div class="pnl-left">
    @if (title) {
      <div class="pnl-header">
        <h2 class="pnl-ttl">{{ title }}</h2>
        <ng-content select="[header-actions]"></ng-content>
      </div>
    }
    <div class="pnl-content">
      <ng-content></ng-content>
    </div>
  </div>

  <div class="pnl-right" [attr.aria-label]="monogram">
    <div class="pnl-right-deco" aria-hidden="true">{{ monogram }}</div>
    <ng-content select="[right-banner]"></ng-content>
  </div>
</div>
